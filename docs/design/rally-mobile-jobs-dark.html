<!-- 모바일 채용 리스트 — 390 × 844. 공통 틀은 rally-mobile-shell 그대로(상단 줄 [리스트 · 통계] + 🔔, 하단 탭 '채용').
     ■ 페이지 제목 "채용 리스트"는 빼고 바로 검색칸부터 (제안).
       상단 줄의 활성 하위 탭이 이미 "리스트"라서 제목을 또 쓰면 같은 말이 두 줄. 390px에서 44px짜리 줄 하나가 아까움.
       다른 후보: 제목 20px 한 줄 + 그 아래 검색 — 데스크톱과 같은 모양이지만 카드가 한 장 덜 보임.
     ■ 회사 상세는 "그 자리에서 펼침"(아코디언) — 상세 시트가 아님 (제안).
       지금 기능이 '여러 장 동시에 펼침'이라 비교하면서 보는 쓰임인데, 시트는 한 번에 한 회사만 되고 닫으면 목록 위치를 잃음.
       펼친 카드는 길어지지만(10줄 ≈ 520px) 카드 머리(회사 이름 · 상태)가 그대로 위에 남아 어느 회사인지 안 헷갈림.
       다른 후보: 카드를 누르면 '회사 상세 시트'가 올라오고 ▾는 없앰 — 상세가 더 길어지거나(첨부·히스토리) 할 때 다시 볼 만함.
     ■ 칸 편집은 아래에서 올라오는 시트 (채택, 데스크톱 팝오버 대신).
       팝오버는 390px에서 오른쪽이 잘리고, 지원상태 11개 · 일정 추가 폼은 세로로 펼 자리가 없음.
       고르기(유형 · 규모 · 우선순위 · 지원상태)는 누르면 바로 반영되고 닫힘 — [저장] 없음.
       입력(마감일 · 공고 · 메모)은 기존 규칙대로 아래 줄 [지우기] … [되돌리기] [저장].
       다른 후보: 칸 바로 아래 인라인 펼침 — 카드 안에 또 접힘이 생겨 두 겹이 되고, 11칩이 들어가면 카드가 더 길어짐.
     ■ 접힌 카드: 지원상태는 '회사 이름과 같은 줄 오른쪽 끝'(제안). 가장 자주 확인하는 값이라 이름과 한 번에 읽히고,
       flex: none이라 회사 이름이 길어도 상태가 잘리지 않음(이름만 … 로 줄어듦).
       다른 후보: 둘째 줄 맨 앞(유형 · 규모 앞) — 이름 길이에 전혀 영향받지 않지만 눈이 두 줄을 왕복함.
     ■ ♡는 카드 오른쪽 바깥 44px 버튼 — 카드 전체가 '펼치기' 버튼이라 그 안에 버튼을 넣을 수 없음(중첩 금지).
       켜짐 = heart색 채운 하트, 꺼짐 = icon-faint 빈 하트.
     ■ 필터는 그 자리 펼침이 아니라 시트 (제안).
       칩 묶음 5그룹(31개)을 목록 위에 펼치면 카드가 화면 밖으로 밀리고, 칩을 누를 때마다 목록이 위아래로 튐.
       시트는 다 고르고 [169개 보기] 한 번 — 결과 수를 버튼에 넣어 적용 전에 몇 개인지 보임.
       다른 후보: 데스크톱처럼 그 자리 펼침(접힌 [필터 ▾] 아래로) — 동작이 데스크톱과 같아지는 건 장점.
     ■ 인쇄(채용 리포트)는 모바일에서 숨김 — 지금 코드 그대로.
     ■ 마감 · 지원상태 표기는 데스크톱 표와 같은 값: D-1 이하 alert · D-3 이하 warn · 그 밖 ink-muted,
