            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #86C4B3"></span>발표</span>
          
            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #A9B1AC"></span>기타</span>
          
          <span style="display: inline-flex; align-items: center; gap: 6px; margin-left: auto">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#A9B1AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14v11l-4 4H5z"></path><path d="M9 9.5h6"></path></svg>메모
          </span>
        </div>
      </section>

      <!-- 날짜 패널 -->
      <aside aria-labelledby="panel-title" style="flex: 0 0 320px; max-width: 100%; box-sizing: border-box; background: #1A1E1C; border: 1px solid #2C3330; border-radius: 8px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 10px 12px 20px; border-bottom: 1px solid #262C29">
          <div style="display: flex; flex-direction: column; line-height: 1.3">
            <h2 id="panel-title" style="margin: 0; font-size: 18px; font-weight: 700">11월 5일 (목)</h2>
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #A9B1AC">이틀 뒤 <span style="padding: 0 6px; border: 1px dashed #3D4541; border-radius: 4px; font-size: 11px">제안</span></span>
          </div>
          <button type="button" aria-label="날짜 패널 닫기" style="width: 40px; height: 40px; border: 0; border-radius: 6px; background: transparent; color: #C3CAC5; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>

        <section aria-labelledby="ev-title" style="padding: 16px 20px 18px; border-bottom: 1px solid #262C29; display: flex; flex-direction: column; gap: 6px">
          <h3 id="ev-title" style="margin: 0; font-size: 15px; font-weight: 700; color: #A9CBB7">채용 일정 <span style="font-weight: 500; color: #A9B1AC">2건</span></h3>
          <ul style="margin: 0; padding: 0; list-style: none">
            
              <li style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #262C29">
                <span style="width: 46px; flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #C3ABD1"><span style="width: 7px; height: 7px; border-radius: 50%; background: #C3ABD1"></span>면접</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
                  <span style="font-weight: 600">[회사 C]</span>
                  <span style="font-size: 13px; color: #A9B1AC">1차 면접 14:00</span>
                </span>
                <a href="#" aria-label="[회사 C] 채용 리스트에서 보기" style="min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border: 1px solid #3D4541; border-radius: 6px; color: #A9CBB7; font-size: 13px; font-weight: 500; text-decoration: none">회사 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
              </li>
            
              <li style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #262C29">
                <span style="width: 46px; flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #E8957A"><span style="width: 7px; height: 7px; border-radius: 50%; background: #E8957A"></span>마감</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.35">
                  <span style="font-weight: 600">[회사 G]</span>
                  <span style="font-size: 13px; color: #A9B1AC">서류 마감 23:59</span>
                </span>
                <a href="#" aria-label="[회사 G] 채용 리스트에서 보기" style="min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border: 1px solid #3D4541; border-radius: 6px; color: #A9CBB7; font-size: 13px; font-weight: 500; text-decoration: none">회사 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
              </li>
            
          </ul>
          <p style="margin: 4px 0 0; font-size: 13px; color: #A9B1AC">일정을 더하거나 고치려면 <a href="#" style="color: #A9CBB7">채용 리스트</a>에서 해주세요.</p>
        </section>

        <section aria-labelledby="memo-title" style="padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
            <h3 id="memo-title" style="margin: 0; font-size: 15px; font-weight: 700; color: #A9CBB7"><label for="day-memo">메모</label></h3>
            <span role="status" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #E3B35C"><span style="width: 6px; height: 6px; border-radius: 50%; background: #E3B35C"></span>변경사항 있음</span>
          </div>
          <textarea id="day-memo" rows="5" placeholder="이 날 짧게 메모해보세요..." style="box-sizing: border-box; width: 100%; padding: 10px 12px; border: 1px solid #8FB5A0; border-radius: 6px; background: #1A1E1C; color: #E9ECE9; font: inherit; font-size: 14px; line-height: 1.65; resize: vertical">[회사 C] 면접 전에 지난 과제 다시 보기
포트폴리오 3번 프로젝트 설명 연습</textarea>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px">
            <button type="button" style="min-height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: #A9B1AC; font: inherit; font-size: 14px; cursor: pointer">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"></path></svg>
              삭제
            </button>
            <button type="button" aria-keyshortcuts="Meta+Enter Control+Enter" style="min-height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 16px; border: 1px solid #2F5A47; border-radius: 6px; background: #2F5A47; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">저장</button>
