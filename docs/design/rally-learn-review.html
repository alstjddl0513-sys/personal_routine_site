<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally 복습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0;background:#F6F7F5}</style>
</head>
<body>
<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #F6F7F5; color: #1C1F1D; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.55; word-break: keep-all; font-variant-numeric: tabular-nums">
  <!-- 사이드바 (공통) — 학습 > 복습 활성 -->
  <aside style="flex: 1 1 216px; max-width: 100%; box-sizing: border-box; padding: 28px 12px 16px; display: flex; flex-direction: column; gap: 28px; background: #1F3D30; border-right: 1px solid #1F3D30">
    <a href="#" style="display: flex; align-items: center; gap: 9px; padding: 0 12px; text-decoration: none; color: #F4F2EC">
      <svg width="20" height="22" viewBox="0 0 20 22" fill="none" aria-hidden="true"><path d="M3.5 21V1.8" stroke="#F4F2EC" stroke-width="2" stroke-linecap="round"></path><path d="M4.5 2.2L18 7.4L4.5 12.4Z" fill="#E9B949"></path></svg>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Rally</span>
    </a>
    <nav aria-label="주 메뉴" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C3CEC6; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5L12 5l8 6.5V20h-5v-5.5H9V20H4z"></path></svg>
        오늘
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C3CEC6; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
        캘린더
      </a>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #C3CEC6; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1.5"></rect><path d="M9 7V4.5h6V7"></path></svg>
        <span style="flex: 1 1 auto">채용</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #C3CEC6; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h6"></path></svg>
        <span style="flex: 1 1 auto">루틴</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #C3CEC6; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"></path></svg>
        <span style="flex: 1 1 auto">운동</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column">
        <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #FFFFFF; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4zM20 5h-6a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20z"></path></svg>
          <span style="flex: 1 1 auto">학습</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <a href="#" style="display: flex; align-items: center; min-height: 32px; padding: 0 12px 0 42px; border-radius: 6px; color: #A9B8AE; text-decoration: none; font-size: 14px">오늘의 학습</a>
        <a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 32px; padding: 0 12px 0 42px; border-radius: 6px; background: #2C4F40; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">복습</a>
        <a href="#" style="display: flex; align-items: center; min-height: 32px; padding: 0 12px 0 42px; border-radius: 6px; color: #A9B8AE; text-decoration: none; font-size: 14px">통계</a>
      </div>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C3CEC6; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"></path></svg>
        블로그
      </a>
    </nav>
    <div style="display: flex; align-items: center; gap: 2px; padding-top: 12px; border-top: 1px solid #36594A">
      <a href="#" style="flex: 1 1 auto; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #C3CEC6; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
        설정
      </a>
      <button type="button" aria-label="다크 모드 전환" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: #C3CEC6; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 1 1 11 3.5a6.5 6.5 0 0 0 9.5 9.5z"></path></svg>
      </button>
      <button type="button" aria-label="알림" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: #C3CEC6; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9M10.3 20.5a1.9 1.9 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
  </aside>
  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 64px">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

      <header style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em">복습</h1>
        <p style="margin: 0; font-size: 15px; color: #3F4441">다시 읽고 이해했으면 이해완료로 바꿔요.</p>
      </header>
      <!-- 제안: 전환 [복습필요 | 별표]과 카테고리 칩을 한 줄에 — 둘 다 "어떤 질문을 볼지" 고르는 거라 붙여 둠. 칩이 넘치면 칩만 다음 줄로.
           전환은 둥근 토글 대신 운동 기록 분할 탭과 같은 세그먼트(개수는 500 ink-muted). 다른 후보: 전환을 제목 줄 오른쪽에 -->
      <div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
        <div role="tablist" aria-label="복습 목록" style="flex: none; display: inline-flex; border: 1px solid #BFC4BE; border-radius: 6px; overflow: hidden"><button type="button" role="tab" aria-selected="true" style="min-height: 40px; padding: 0 16px; border-top: 0; border-right: 0; border-bottom: 0; border-left: 0; background: #E6EEE8; box-shadow: inset 0 0 0 2px #1F3D30; border-radius: 6px; color: #1F3D30; font-weight: 700; font-family: inherit; font-size: 14px; cursor: pointer">복습필요 <span style="font-weight: 500; color: #4F5450">12</span></button><button type="button" role="tab" aria-selected="false" style="border-left: 1px solid #BFC4BE; min-height: 40px; padding: 0 16px; border-top: 0; border-right: 0; border-bottom: 0; background: transparent; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">별표 <span style="font-weight: 500; color: #4F5450">4</span></button></div>
        <span aria-hidden="true" style="width: 1px; height: 24px; background: #CDD1CC"></span>
        <div style="flex: 1 1 400px; min-width: 0"><div role="group" aria-label="카테고리" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="true" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #E6EEE8; box-shadow: inset 0 0 0 2px #1F3D30; color: #1F3D30; font-weight: 700; font-family: inherit; font-size: 14px; cursor: pointer">전체</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">네트워크</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">운영체제</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">데이터베이스</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">자료구조</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">JavaScript</button><button type="button" aria-pressed="false" style="flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #BFC4BE; color: #3F4441; font-weight: 500; font-family: inherit; font-size: 14px; cursor: pointer">React</button></div></div>
        <span style="flex: none; align-self: center; padding: 0 6px; border: 1px dashed #BFC4BE; border-radius: 4px; font-size: 11px; font-weight: 400; color: #4F5450">제안</span>
      </div>
      <!-- 복습 카드: 같은 카드, 위 줄의 점 5개 대신 표시한 날("11월 2일에 표시") — 목록이 오래 전에 표시한 순서라 지금 어디쯤인지 날짜로 읽힘 -->
      <article aria-label="질문 4" style="max-width: 800px; box-sizing: border-box; padding: 22px 28px 24px; background: #FFFFFF; border: 1px solid #D9DCD8; border-radius: 8px; display: flex; flex-direction: column; gap: 20px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px"><div style="display: flex; align-items: center; gap: 12px; min-width: 0"><span style="font-size: 13px; font-weight: 600; color: #4F5450">운영체제</span><span aria-hidden="true" style="width: 1px; height: 14px; background: #CDD1CC"></span><span style="font-size: 14px; color: #3F4441"><strong style="font-weight: 600; color: #1C1F1D">4</strong> / 12</span><span style="font-size: 13px; color: #4F5450">11월 2일에 표시</span></div><div style="display: flex; align-items: center; gap: 6px"><span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: #9A6700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4.5v4h-4"></path></svg>복습필요</span><button type="button" aria-pressed="false" aria-label="별표" title="별표" style="flex: none; width: 40px; height: 40px; margin-left: 4px; border: 0; border-radius: 6px; background: transparent; color: #4F5450; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.6L12 16.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z"></path></svg></button><span style="display: flex; gap: 6px; margin-left: 4px"><button type="button" aria-label="이전 질문" title="이전 (←)" style="flex: none; width: 40px; height: 40px; border: 1px solid #BFC4BE; border-radius: 6px; background: transparent; color: #1F3D30; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button><button type="button" aria-label="다음 질문" title="다음 (→)" style="flex: none; width: 40px; height: 40px; border: 1px solid #BFC4BE; border-radius: 6px; background: transparent; color: #1F3D30; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button></span></div></div><h2 style="margin: 0; display: flex; gap: 10px; font-size: 20px; line-height: 1.45; font-weight: 600; color: #1C1F1D"><span aria-hidden="true" style="flex: none; color: #1F3D30; font-weight: 700">Q.</span><span>프로세스와 스레드의 차이는?</span></h2><div style="display: flex; flex-direction: column; gap: 12px; padding-left: 32px"><div><button type="button" title="답 보기 (Space)" style="flex: none; min-height: 40px; padding: 0 18px; border: 0; border-radius: 6px; background: #1F3D30; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">답 보기</button></div></div>
      </article>
    </div>
  </main>
</div>
</body>
</html>
