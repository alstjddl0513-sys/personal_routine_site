<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally 채용 리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=Noto+Serif+KR:wght@600&amp;display=swap">
<style>
body{margin:0;background:#121514}
</style>
</head>
<body>

<div style="min-height: 100vh; box-sizing: border-box; display: flex; flex-wrap: wrap; background: #121514; color: #E9ECE9; font-family: 'IBM Plex Sans KR', system-ui, sans-serif; font-size: 15px; line-height: 1.55; word-break: keep-all; font-variant-numeric: tabular-nums">

  <!-- 사이드바 (공통) — 채용 > 리스트 활성 -->
  <aside style="flex: 1 1 216px; max-width: 100%; box-sizing: border-box; padding: 28px 12px 16px; display: flex; flex-direction: column; gap: 28px; background: #16271F; border-right: 1px solid #22372D">
    <a href="#" style="display: flex; align-items: center; gap: 9px; padding: 0 12px; text-decoration: none; color: #F4F2EC">
      <svg width="20" height="22" viewBox="0 0 20 22" fill="none" aria-hidden="true"><path d="M3.5 21V1.8" stroke="#F4F2EC" stroke-width="2" stroke-linecap="round"></path><path d="M4.5 2.2L18 7.4L4.5 12.4Z" fill="#E9B949"></path></svg>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Rally</span>
    </a>
    <nav aria-label="주 메뉴" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: none; display: flex; flex-direction: column; gap: 2px">
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #BAC6BE; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5L12 5l8 6.5V20h-5v-5.5H9V20H4z"></path></svg>
        오늘
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #BAC6BE; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="1.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
        캘린더
      </a>
      <div style="display: flex; flex-direction: column">
        <button type="button" aria-expanded="true" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #FFFFFF; font: inherit; font-weight: 600; text-align: left; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1.5"></rect><path d="M9 7V4.5h6V7"></path></svg>
          <span style="flex: 1 1 auto">채용</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <a href="#" aria-current="page" style="display: flex; align-items: center; min-height: 32px; padding: 0 12px 0 42px; border-radius: 6px; background: #25443A; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 600">리스트</a>
        <a href="#" style="display: flex; align-items: center; min-height: 32px; padding: 0 12px 0 42px; border-radius: 6px; color: #9FB0A5; text-decoration: none; font-size: 14px">통계</a>
      </div>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #BAC6BE; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h6"></path></svg>
        <span style="flex: 1 1 auto">루틴</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #BAC6BE; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"></path></svg>
        <span style="flex: 1 1 auto">운동</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button type="button" aria-expanded="false" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: #BAC6BE; font: inherit; text-align: left; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h6a2 2 0 0 1 2 2v13a1.5 1.5 0 0 0-1.5-1.5H4zM20 5h-6a2 2 0 0 0-2 2v13a1.5 1.5 0 0 1 1.5-1.5H20z"></path></svg>
        <span style="flex: 1 1 auto">학습</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #BAC6BE; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"></path></svg>
        블로그
      </a>
    </nav>
    <div style="display: flex; align-items: center; gap: 2px; padding-top: 12px; border-top: 1px solid #2A4237">
      <a href="#" style="flex: 1 1 auto; display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 6px; color: #BAC6BE; text-decoration: none">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>
        설정
      </a>
      <button type="button" aria-label="라이트 모드 전환" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: #BAC6BE; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zM12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
      </button>
      <button type="button" aria-label="알림" style="width: 40px; height: 40px; flex: none; border: 0; border-radius: 6px; background: transparent; display: inline-flex; align-items: center; justify-content: center; color: #BAC6BE; cursor: pointer">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 8 2.5 8h-17S6 15 6 9M10.3 20.5a1.9 1.9 0 0 0 3.4 0"></path></svg>
      </button>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px 40px 64px">
    <div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

      <!-- 제목 + 도구 -->
      <header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
        <h1 style="margin: 0; font-size: 26px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em">채용 리스트</h1>
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
          <label style="position: relative; display: flex; align-items: center">
            <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">회사명 검색</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B1AC" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 12px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
            <input type="search" placeholder="회사명으로 찾기" style="width: 240px; min-height: 40px; box-sizing: border-box; padding: 0 12px 0 36px; border: 1px solid #3D4541; border-radius: 6px; background: #1A1E1C; color: #E9ECE9; font: inherit; font-size: 14px">
          </label>
          <button type="button" aria-pressed="false" style="min-height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid #3D4541; border-radius: 6px; background: #1A1E1C; color: #C3CAC5; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
            즐겨찾기만
          </button>
          <a href="#" style="min-height: 40px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid #3D4541; border-radius: 6px; background: #1A1E1C; color: #C3CAC5; font-size: 14px; font-weight: 500; text-decoration: none">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V4h10v5M7 17H5a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M7 14h10v6H7z"></path></svg>
            인쇄
          </a>
          <button type="button" style="min-height: 40px; display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; border: 1px solid #2F5A47; border-radius: 6px; background: #2F5A47; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            추가하기
          </button>
        </div>
      </header>

      <!-- 필터 -->
      <section aria-label="필터" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 0 14px; border-top: 1px solid #2E3531; border-bottom: 1px solid #2E3531">
        
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px">
            
              <div role="group" aria-label="유형" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; ">
                <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #A9B1AC">유형</span>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    서비스
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    솔루션
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    SI
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    인하우스
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    랩
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    프리랜서
                  </button>
                
                
                  <a href="#" style="margin-left: 4px; min-height: 36px; display: inline-flex; align-items: center; font-size: 13px; color: #A9B1AC">유형 관리</a>
                
              </div>
            
          </div>
        
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px">
            
              <div role="group" aria-label="규모" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; ">
                <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #A9B1AC">규모</span>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    대기업
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    중소
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    스타트업
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    외국계
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    공공
                  </button>
                
                
              </div>
            
              <div role="group" aria-label="우선순위" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-left: 24px; border-left: 1px solid #2E3531">
                <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #A9B1AC">우선순위</span>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    긴급
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    상
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    하
                  </button>
                
                
              </div>
            
              <div role="group" aria-label="채용중" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-left: 24px; border-left: 1px solid #2E3531">
                <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #A9B1AC">채용중</span>
                
                  <button type="button" aria-pressed="true" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #8FB5A0; background: #1F3328; color: #CFE3D6; font-weight: 600">
                    
                    채용중
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                    채용 안 함
                  </button>
                
                
              </div>
            
          </div>
        
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px">
            
              <div role="group" aria-label="지원상태" style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; ">
                <span style="width: 64px; flex: none; font-size: 13px; font-weight: 600; color: #A9B1AC">지원상태</span>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                      <span style="width: 7px; height: 7px; border-radius: 50%; background: transparent; box-shadow: inset 0 0 0 1.5px #8C948F"></span>
                    
                    미지원
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                      <span style="width: 7px; height: 7px; border-radius: 50%; background: #9DB5D8"></span>
                    
                    지원
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                      <span style="width: 7px; height: 7px; border-radius: 50%; background: #9CC7B5"></span>
                    
                    서류합격
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                      <span style="width: 7px; height: 7px; border-radius: 50%; background: #59605C"></span>
                    
                    서류탈락
                  </button>
                
                  <button type="button" aria-pressed="false" style="min-height: 36px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer; border: 1px solid #3D4541; background: #1A1E1C; color: #C3CAC5; font-weight: 400">
                    
                      <span style="width: 7px; height: 7px; border-radius: 50%; background: #86C4B3"></span>
                    
                    1차합격
